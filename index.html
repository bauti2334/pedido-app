<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE PUNTOS GRANADEROS PROVINCIALES</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-card: #0d1117;
            --accent: #00ff41;
            --danger: #da3633;
            --border: #30363d;
            --text: #c9d1d9;
            --warning: #c69026;
            --info: #388bfd;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', Courier, monospace; background: var(--bg-dark); color: var(--text); line-height: 1.6; overflow-x: hidden; }

        /* LOGIN */
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { border: 2px solid var(--accent); padding: 40px; text-align: center; background: #161b22; box-shadow: 0 0 20px rgba(0,255,65,0.2); }
        .login-box input { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 10px; text-align: center; font-size: 1.5rem; width: 150px; outline: none; }

        /* CONTENIDO */
        #mainContent { display: none; }
        .container { max-width: 1200px; margin: 0 auto; background: var(--bg-card); min-height: 100vh; border-inline: 1px solid var(--border); }
        header { padding: 20px 40px; background: #161b22; border-bottom: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .logo-img { height: 50px; filter: drop-shadow(0 0 5px var(--accent)); }
        
        .tabs { display: flex; background: #161b22; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .tab { padding: 15px 20px; cursor: pointer; background: transparent; border: none; color: #8b949e; font-family: inherit; text-transform: uppercase; border-bottom: 3px solid transparent; }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(0, 255, 65, 0.05); }

        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }

        .section-header { color: var(--accent); margin: 20px 0; border-bottom: 1px solid var(--border); padding-bottom: 10px; text-transform: uppercase; font-weight: bold; }
        .military-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; align-items: end; }
        input, select, textarea { width: 100%; padding: 12px; background: #0d1117; border: 1px solid var(--border); color: #fff; font-family: inherit; }
        
        button { padding: 12px 20px; background: #238636; color: white; border: none; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 4px; }
        button.danger { background: var(--danger); }
        button.info { background: var(--info); }
        button.promote { background: var(--warning); color: black; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0d1117; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
        th { background: #161b22; color: var(--accent); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .stat-box { background: #161b22; padding: 20px; border: 1px solid var(--border); border-top: 3px solid var(--accent); }
        
        /* Ocultar input de archivo */
        #fileInput { display: none; }
    </style>
</head>
<body>

<div id="loginScreen">
    <img src="https://i.postimg.cc/przFCQg4/imagen-2025-12-17-165339410.png" alt="Logo" style="height: 80px; margin-bottom: 20px;">
    <div class="login-box">
        <h2 style="color: var(--accent); margin-bottom: 15px;">LOGIN REQUERIDO</h2>
        <input type="password" id="passInput" maxlength="4" autofocus>
        <p id="errorMsg" style="color: red; display: none; margin-top: 10px;">CLAVE INCORRECTA</p>
    </div>
</div>

<div id="mainContent" class="container">
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="https://i.postimg.cc/przFCQg4/imagen-2025-12-17-165339410.png" alt="Logo" class="logo-img">
            <h1>GRANADEROS PROVINCIALES</h1>
        </div>
        <div id="currentDateTime" style="color: var(--accent);"></div>
    </header>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('eventos', event)">OPERACIONES</button>
        <button class="tab" onclick="switchTab('asistencia', event)">ASISTENCIA</button>
        <button class="tab" onclick="switchTab('combate', event)">COMBATE</button>
        <button class="tab" onclick="switchTab('promociones', event)">ESCALAFÓN</button>
        <button class="tab" onclick="switchTab('intel', event)">INTELIGENCIA</button>
        <button class="tab" onclick="switchTab('personal', event)">PERSONAL</button>
    </div>

    <div id="eventos" class="tab-content active">
        <div class="section-header">// NUEVA OPERACIÓN</div>
        <div class="military-grid">
            <input type="date" id="eventoFecha">
            <input type="text" id="eventoNombre" placeholder="NOMBRE OP">
            <button onclick="agregarEvento()">REGISTRAR</button>
        </div>
        <table id="tablaEventos"><thead><tr><th>FECHA</th><th>OPERACIÓN</th><th>X</th></tr></thead><tbody></tbody></table>
    </div>

    <div id="asistencia" class="tab-content">
        <div class="section-header">// ASISTENCIA</div>
        <div class="military-grid"><select id="asistenciaEvento"></select><select id="asistenciaSoldado"></select><button onclick="marcarAsistencia()">CONFIRMAR</button></div>
        <table id="tablaAsistencias"><thead><tr><th>OPERADOR</th><th>OP</th><th>FECHA</th><th>X</th></tr></thead><tbody></tbody></table>
    </div>

    <div id="combate" class="tab-content">
        <div class="section-header">// COMBATE</div>
        <div class="military-grid"><select id="combateEvento"></select><select id="combateSoldado"></select><input type="number" id="combateKills" placeholder="K"><button onclick="registrarCombate()">OK</button></div>
        <table id="tablaCombate"><thead><tr><th>OP</th><th>SOLDADO</th><th>K</th><th>X</th></tr></thead><tbody></tbody></table>
    </div>

    <div id="promociones" class="tab-content">
        <div class="section-header">// ESCALAFÓN</div>
        <table id="tablaPromociones"><thead><tr><th>NOMBRE</th><th>RANGO</th><th>PUNTOS</th><th>ACCION</th></tr></thead><tbody></tbody></table>
    </div>

    <div id="intel" class="tab-content">
        <div class="section-header">// INTELIGENCIA Y BACKUP</div>
        <div class="stats-grid">
            <div class="stat-box"><h3>TOP PUNTOS</h3><table id="tablaTopPuntos"><tbody></tbody></table></div>
            <div class="stat-box"><h3>RESUMEN</h3><p>OPS TOTALES: <span id="totalOperaciones">0</span></p></div>
        </div>
        
        <div class="section-header" style="margin-top:40px;">// GESTIÓN DE DATOS EXTERNOS</div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="info" onclick="exportarDatos()">DESCARGAR BACKUP (.JSON)</button>
            
            <input type="file" id="fileInput" accept=".json" onchange="importarDatos(event)">
            <button style="background: #8a2be2;" onclick="document.getElementById('fileInput').click()">SUBIR/IMPORTAR JSON</button>
            
            <button class="danger" onclick="resetearTodo()">BORRAR TODO</button>
        </div>
    </div>

    <div id="personal" class="tab-content">
        <div class="section-header">// REGISTRO</div>
        <textarea id="listaNombres" placeholder="Nombres..."></textarea>
        <button onclick="cargarNombres()">INGRESAR</button>
        <table id="tablaNombres"><tbody></tbody></table>
    </div>
</div>

<script>
    const ACCESS_CODE = "2306";
    const DB_NAME = 'regimiento_master_data';
    const RANGOS = ["Recluta", "Soldado", "Soldado Primera", "Cabo Segundo", "Cabo Primero", "Sargento Segundo", "Sargento Primero"];
    let datos = { soldados: [], eventos: [], asistencias: [], combates: [] };

    // LOGIN
    document.getElementById('passInput').addEventListener('input', (e) => {
        if(e.target.value === ACCESS_CODE) {
            sessionStorage.setItem('auth', 'true');
            init();
        }
    });

    function init() {
        if(sessionStorage.getItem('auth') !== 'true') return;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        const stored = localStorage.getItem(DB_NAME);
        if (stored) datos = JSON.parse(stored);
        actualizarTodo();
        setInterval(() => { document.getElementById('currentDateTime').textContent = new Date().toLocaleString(); }, 1000);
    }

    // --- FUNCIÓN PARA IMPORTAR EL JSON ---
    function importarDatos(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const contenido = JSON.parse(e.target.result);
                
                // Validación básica de estructura
                if (contenido.soldados && contenido.eventos) {
                    if (confirm("¿Estás seguro? Esto reemplazará todos los datos actuales por los del archivo.")) {
                        datos = contenido;
                        guardar();
                        actualizarTodo();
                        alert("Sincronización exitosa.");
                    }
                } else {
                    alert("El archivo no tiene el formato correcto de Granaderos.");
                }
            } catch (err) {
                alert("Error al leer el archivo JSON.");
            }
        };
        reader.readAsText(file);
    }

    function guardar() { localStorage.setItem(DB_NAME, JSON.stringify(datos)); }

    function actualizarTodo() {
        guardar();
        // (Aquí van todas tus funciones de renderizado que ya teníamos)
        const optSol = datos.soldados.map(s => `<option value="${s.nombre}">${s.nombre}</option>`).sort().join('');
        const optEv = datos.eventos.map(e => `<option value="${e.id}">${e.fecha} | ${e.nombre}</option>`).reverse().join('');
        document.getElementById('asistenciaSoldado').innerHTML = document.getElementById('combateSoldado').innerHTML = '<option value="">--</option>' + optSol;
        document.getElementById('asistenciaEvento').innerHTML = document.getElementById('combateEvento').innerHTML = '<option value="">--</option>' + optEv;
        
        renderEventos(); renderPromociones(); renderIntel(); renderAsistencias(); renderCombate(); renderPersonal();
    }

    // Funciones de render (Versión simplificada para el ejemplo)
    function renderEventos() { document.querySelector('#tablaEventos tbody').innerHTML = datos.eventos.map(e => `<tr><td>${e.fecha}</td><td>${e.nombre}</td><td><button class="danger" onclick="eliminarRegistro('eventos', ${e.id})">X</button></td></tr>`).reverse().join(''); }
    function renderPromociones() { document.querySelector('#tablaPromociones tbody').innerHTML = datos.soldados.sort((a,b)=>b.puntos-a.puntos).map(s => `<tr><td>${s.nombre}</td><td>${s.rango}</td><td>${s.puntos}</td><td><button onclick="ajustarPuntos('${s.nombre}', 1)">+1</button></td></tr>`).join(''); }
    function renderIntel() { document.getElementById('totalOperaciones').textContent = datos.eventos.length; }
    function renderAsistencias() { document.querySelector('#tablaAsistencias tbody').innerHTML = datos.asistencias.map(a => `<tr><td>${a.soldado}</td><td>OP ID:${a.eventoId}</td><td><button class="danger" onclick="eliminarRegistro('asistencias', ${a.id})">X</button></td></tr>`).join(''); }
    function renderCombate() { document.querySelector('#tablaCombate tbody').innerHTML = datos.combates.map(c => `<tr><td>OP ID:${c.eventoId}</td><td>${c.soldado}</td><td>${c.kills}</td><td><button class="danger" onclick="eliminarRegistro('combates', ${c.id})">X</button></td></tr>`).join(''); }
    function renderPersonal() { document.querySelector('#tablaNombres tbody').innerHTML = datos.soldados.map(s => `<tr><td>${s.nombre}</td></tr>`).join(''); }

    function agregarEvento() { const f = document.getElementById('eventoFecha').value; const n = document.getElementById('eventoNombre').value; if(f && n) { datos.eventos.push({fecha:f, nombre:n, id:Date.now()}); actualizarTodo(); } }
    function ajustarPuntos(n, p) { const s = datos.soldados.find(x=>x.nombre==n); if(s) { s.puntos += p; actualizarTodo(); } }
    function cargarNombres() { const lines = document.getElementById('listaNombres').value.split('\n').filter(n=>n.trim()); lines.forEach(n => { if(!datos.soldados.find(s=>s.nombre==n)) datos.soldados.push({nombre:n, puntos:0, rango:RANGOS[0]}); }); actualizarTodo(); }
    function switchTab(t, e) { document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active')); document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); document.getElementById(t).classList.add('active'); e.currentTarget.classList.add('active'); }
    function exportarDatos() { const blob = new Blob([JSON.stringify(datos)], {type:"application/json"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "granaderos_backup.json"; a.click(); }
    function resetearTodo() { if(confirm("¿BORRAR TODO?")) { localStorage.clear(); location.reload(); } }
    function eliminarRegistro(t, i) { datos[t] = datos[t].filter(x=>x.id!==i); actualizarTodo(); }

    if(sessionStorage.getItem('auth') === 'true') init();
</script>
</body>
</html>
